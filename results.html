<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RESULT — Tổng kết</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#eefaff}
body{touch-action:manipulation}button{font:inherit}
#app{width:100vw;height:100vh;overflow:hidden;position:relative}
.top-art{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#effbff 0%,#fff 68%,#f2fbff 100%)}
.top-art:before,.top-art:after{content:"";position:absolute;pointer-events:none}.top-art:before{left:-8vw;top:-9vh;width:55vw;height:20vh;background:#18b9ec;transform:rotate(-17deg);border-bottom:7px solid #ffe900}.top-art:after{right:-8vw;bottom:-9vh;width:55vw;height:20vh;background:#19b9eb;transform:rotate(-17deg);border-top:7px solid #ffe900}
.header{height:18vh;min-height:105px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;color:#172338}
.brand{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.brand-small{font-size:9px;letter-spacing:10px;font-weight:900;color:#536b78;margin-left:10px}.brand h1{margin:3px 0 0;font-size:clamp(34px,5vw,62px);line-height:.9;font-weight:1000;letter-spacing:-3px;color:#172033;text-shadow:2px 2px 0 #c9e4ef}.brand h1 span{color:#11a9df;font-style:italic}.brand-sub{font-size:clamp(10px,1vw,15px);letter-spacing:7px;font-weight:900;color:#70818c;margin-top:7px}
.logo-right{position:absolute;right:6%;top:14px;text-align:center;color:#171c2a;font-weight:900}.logo-right .cup{font-size:10px;letter-spacing:7px}.logo-right .mark{font-size:34px;color:#d51f2f;line-height:1}.logo-right .cn{font-size:18px;vertical-align:8px;margin-left:6px}
#listView{position:absolute;z-index:4;left:9%;right:9%;top:20vh;bottom:8vh;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:12px}
.group-row{height:calc((100% - 36px)/4);min-height:55px;border:0;border-radius:12px;background:linear-gradient(90deg,#0da8df,#0788c8);box-shadow:0 5px 18px rgba(18,72,110,.25);color:#fff;display:grid;grid-template-columns:1fr auto 55px;align-items:center;padding:0 22px;cursor:pointer;transition:.18s transform,.18s filter}.group-row:hover{filter:brightness(1.08);transform:translateY(-1px)}.group-row:active{transform:scale(.995)}.group-num{font-size:clamp(16px,2vw,28px);font-weight:1000}.group-name{font-size:clamp(15px,2vw,26px);font-weight:1000;text-align:left}.group-meta{font-size:clamp(10px,1.2vw,15px);font-weight:800;opacity:.92;text-align:right}.group-arrow{font-size:28px;font-weight:1000;text-align:right}
#resultView{position:absolute;inset:0;z-index:5;display:none}.result-top{position:absolute;left:2%;right:2%;top:18vh;height:7vh;display:flex;align-items:center;justify-content:space-between;background:#08a8e0;border-radius:12px 12px 0 0;padding:0 14px;box-shadow:0 5px 20px rgba(18,72,110,.18)}.back{border:0;background:rgba(0,0,0,.16);color:#fff;border-radius:8px;padding:7px 12px;font-weight:900;cursor:pointer}.result-title{font-size:clamp(14px,1.7vw,24px);font-weight:1000}.live{font-size:10px;font-weight:900;background:#0a6f9f;padding:6px 9px;border-radius:999px}
.board{position:absolute;z-index:3;left:2%;right:2%;top:25vh;bottom:13vh;background:#253d62;border-radius:0 0 13px 13px;box-shadow:0 5px 20px rgba(18,72,110,.2);overflow:hidden}.rounds{display:grid;grid-template-columns:repeat(9,1fr);height:8vh;min-height:45px;background:#0da8df;border-bottom:2px solid #087cb2}.round-title{display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(9px,1.1vw,16px);border-right:1px solid rgba(0,0,0,.18)}.columns{display:grid;grid-template-columns:repeat(9,1fr);height:calc(100% - 8vh);min-height:0}.round-col{min-width:0;border-right:1px solid rgba(14,31,55,.6);position:relative;overflow:hidden;background:linear-gradient(180deg,#2b466f,#20375b)}.round-col.empty:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(120,164,207,.16) 0 15%,transparent 16%),linear-gradient(90deg,transparent 49%,rgba(255,255,255,.03) 50%,transparent 51%)}.match-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.62;filter:saturate(1.08)}.match-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,36,67,.12),rgba(15,36,67,.38))}.player-list{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:2px 4px 3px}.player{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;text-shadow:0 1px 3px #00172e;line-height:1.05;padding:3px 1px}.player .name{font-size:clamp(7px,.9vw,13px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.player .score{font-size:clamp(10px,1.1vw,16px);margin-top:3px;color:#fff}.player.win .score{color:#fff000}.player.win .name:before{content:'👑 ';font-size:.72em}.map-name{position:absolute;left:0;right:0;bottom:0;background:rgba(0,125,190,.92);height:10%;min-height:23px;display:flex;align-items:center;justify-content:center;font-size:clamp(7px,.82vw,13px);font-weight:1000;text-shadow:0 1px 2px rgba(0,0,0,.75);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;z-index:5}.totalbar{position:absolute;z-index:5;left:2%;right:2%;bottom:5vh;height:7vh;min-height:45px;background:#08a8e0;border-radius:0 0 13px 13px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 4px 15px rgba(0,80,130,.18);overflow:hidden}.total{display:flex;align-items:center;justify-content:center;gap:7px;border-right:1px solid rgba(255,255,255,.75);font-size:clamp(9px,1.05vw,17px);font-weight:900}.total:last-child{border-right:0}.total .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}.total .p{font-size:clamp(11px,1.3vw,20px);font-weight:1000}.year{position:absolute;z-index:4;left:0;right:0;bottom:.2vh;text-align:center;color:#27313a;font-weight:900;letter-spacing:clamp(7px,1vw,16px);font-size:clamp(14px,1.7vw,26px);padding-left:16px}.corner{position:absolute;z-index:6;right:6px;bottom:2px;font-size:9px;opacity:.55;color:#8fa8b8}.status{position:absolute;z-index:10;left:10px;bottom:6px;font-size:9px;color:#77909e;background:rgba(255,255,255,.65);padding:2px 5px;border-radius:4px}
@media(max-width:900px){#listView{left:4%;right:4%;gap:8px}.group-row{padding:0 12px;grid-template-columns:1fr auto 30px}.group-meta{display:none}.result-top{left:1%;right:1%}.board{left:1%;right:1%}.totalbar{left:1%;right:1%}.logo-right{right:2%}.brand-sub{letter-spacing:3px}.round-title{font-size:8px}.player .name{font-size:6.5px}.player .score{font-size:9px}}
</style>
</head>
<body>
<div id="app">
<div class="top-art"></div>
<header class="header"><div class="brand"><div class="brand-small">Z I N G S P E E D</div><h1>RESULT<span>™</span></h1><div class="brand-sub">ASIAN CUP</div></div><div class="logo-right"><div class="cup">ASIAN CUP</div><div><span class="mark">♜</span><span class="cn">红魔</span></div></div></header>
<section id="listView"></section>
<section id="resultView">
  <div class="result-top"><button class="back" onclick="showList()">← BẢNG ĐẤU</button><div id="resultTitle" class="result-title">BẢNG A</div><div class="live">● LIVE</div></div>
  <section class="board"><div id="rounds" class="rounds"></div><div id="columns" class="columns"></div></section>
  <section id="totals" class="totalbar"></section>
</section>
<div class="year">2 0 2 5 &nbsp; A S I A N &nbsp; C U P</div><div id="status" class="status">Đang tải...</div>
</div>
<script>
const SHEET_ID='1_zrKpwAp0s8hMv8LZK208Qc-0SGE6npj_offF3ej5cw';
const SHEET_GVIZ=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;
let state={tournamentData:[],qualifyCount:3,updatedAt:null};let inventory={maps:[]};let selectedGroup=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());cell='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cell+=c}row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);return rows}
async function loadMaps(){try{const r=await fetch(SHEET_GVIZ+encodeURIComponent('MAP'),{cache:'no-store'});if(!r.ok)return;const rows=parseCSV(await r.text());if(!rows.length)return;const h=rows[0].map(x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'));inventory.maps=rows.slice(1).map(r=>{const o={};h.forEach((x,i)=>o[x]=(r[i]||'').trim());return{name:o['ten map']||o['map']||o['ten']||'',image:o['anh map']||o['image map']||o['anh']||o['image']||''}}).filter(x=>x.name);render();}catch(e){}}
function loadData(){try{const s=JSON.parse(localStorage.getItem('zsm_tournament_state')||'null');if(s&&Array.isArray(s.tournamentData))state=s;else state={tournamentData:[],qualifyCount:3,updatedAt:null};}catch(e){state={tournamentData:[],qualifyCount:3,updatedAt:null}}state.tournamentData=state.tournamentData||[];state.tournamentData.forEach(g=>{g.players=g.players||[];g.matches=g.matches||[];g.matches.forEach(m=>m.scores=m.scores||[])});if(selectedGroup>=state.tournamentData.length)selectedGroup=0;render();}
function score(g,p,r){return Number(g.matches?.[r]?.scores?.[p])||0}function total(g,p){return (g.matches||[]).reduce((s,m,r)=>s+score(g,p,r),0)}
function showList(){selectedGroup=0;document.getElementById('resultView').style.display='none';document.getElementById('listView').style.display='flex';renderList()}
function openGroup(i){if(!state.tournamentData[i])return;selectedGroup=i;document.getElementById('listView').style.display='none';document.getElementById('resultView').style.display='block';renderTable()}
function renderList(){const list=document.getElementById('listView');const groups=state.tournamentData||[];if(!groups.length){list.innerHTML='<div class="group-row" style="cursor:default"><div class="group-name">Chưa có bảng đấu</div><div></div><div>—</div></div>';return}list.innerHTML=groups.map((g,i)=>{const players=g.players||[];return `<button class="group-row" onclick="openGroup(${i})"><div class="group-name">${esc(g.name||('BẢNG '+String.fromCharCode(65+i)))}</div><div class="group-meta">${(g.matches||[]).length} ROUND · ${players.length} tuyển thủ</div><div class="group-arrow">›</div></button>`}).join('')}
function renderTable(){const g=state.tournamentData[selectedGroup]||{name:'',players:[],matches:[]};document.getElementById('resultTitle').textContent=g.name||('BẢNG '+String.fromCharCode(65+selectedGroup));document.getElementById('status').textContent=state.updatedAt?`Cập nhật ${new Date(state.updatedAt).toLocaleString('vi-VN')}`:'Kết quả thi đấu';const rounds=document.getElementById('rounds'),columns=document.getElementById('columns');const ms=g.matches||[];rounds.innerHTML=Array.from({length:9},(_,i)=>`<div class="round-title">ROUND ${i+1}</div>`).join('');columns.innerHTML='';const players=g.players||[];
for(let r=0;r<9;r++){const m=ms[r];const col=document.createElement('div');col.className='round-col'+(m?'':' empty');if(m){const map=Number.isInteger(m.mapIndex)?inventory.maps[m.mapIndex]:null;if(map?.image){const bg=document.createElement('div');bg.className='match-bg';bg.style.backgroundImage=`url("${String(map.image).replace(/"/g,'&quot;')}")`;col.appendChild(bg);const ov=document.createElement('div');ov.className='match-overlay';col.appendChild(ov)}const list=document.createElement('div');list.className='player-list';const vals=players.map((_,i)=>score(g,i,r));const max=Math.max(...vals,0);players.forEach((p,i)=>{const el=document.createElement('div');el.className='player'+(vals[i]===max&&max>0?' win':'');el.innerHTML=`<div class="name">${esc(p.name||'')}</div><div class="score">+${vals[i]}</div>`;list.appendChild(el)});col.appendChild(list);const mn=document.createElement('div');mn.className='map-name';mn.textContent=map?.name||'CHƯA CHỌN MAP';col.appendChild(mn)}columns.appendChild(col)}
const top=players.map((p,i)=>({p,i,t:total(g,i)})).sort((a,b)=>b.t-a.t);document.getElementById('totals').innerHTML=top.slice(0,4).map(x=>`<div class="total"><span class="n">${esc(x.p.name||'')}</span><span class="p">${x.t}</span></div>`).join('');while(document.getElementById('totals').children.length<4)document.getElementById('totals').insertAdjacentHTML('beforeend','<div class="total"><span class="n">—</span><span class="p">0</span></div>')}
function render(){renderList();if(document.getElementById('resultView').style.display==='block')renderTable()}
window.addEventListener('storage',e=>{if(e.key==='zsm_tournament_state')loadData()});
window.addEventListener('focus',loadData);
loadData();loadMaps();setInterval(loadData,1500);
</script>
</body>
</html>
