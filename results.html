<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RESULT — Tổng kết</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#dff6ff}
body{background:#eefaff}
#app{width:100vw;height:100vh;overflow:hidden;position:relative}
.top-art{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#effbff 0%,#fff 68%,#f2fbff 100%)}
.top-art:before,.top-art:after{content:"";position:absolute;pointer-events:none}
.top-art:before{left:-8vw;top:-9vh;width:55vw;height:20vh;background:#18b9ec;transform:rotate(-17deg);border-bottom:7px solid #ffe900}
.top-art:after{right:-8vw;bottom:-9vh;width:55vw;height:20vh;background:#19b9eb;transform:rotate(-17deg);border-top:7px solid #ffe900}
.header{height:18vh;min-height:110px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;color:#172338}
.brand{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.brand-small{font-size:9px;letter-spacing:10px;font-weight:900;color:#536b78;margin-left:10px}
.brand h1{margin:3px 0 0;font-size:clamp(36px,5vw,62px);line-height:.9;font-weight:1000;letter-spacing:-3px;color:#172033;text-shadow:2px 2px 0 #c9e4ef}
.brand h1 span{color:#11a9df;font-style:italic}.brand-sub{font-size:clamp(10px,1vw,15px);letter-spacing:7px;font-weight:900;color:#70818c;margin-top:7px}
.logo-right{position:absolute;right:6%;top:14px;text-align:center;color:#171c2a;font-weight:900}.logo-right .cup{font-size:10px;letter-spacing:7px}.logo-right .mark{font-size:34px;color:#d51f2f;line-height:1}.logo-right .cn{font-size:18px;vertical-align:8px;margin-left:6px}
.board{position:absolute;z-index:3;left:8%;right:8%;top:18vh;bottom:11vh;background:#253d62;border-radius:0 0 13px 13px;box-shadow:0 5px 20px rgba(18,72,110,.2);overflow:hidden}
.rounds{display:grid;grid-template-columns:repeat(9,1fr);height:8vh;min-height:48px;background:#0da8df;border-bottom:2px solid #087cb2}
.round-title{display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(10px,1.15vw,16px);letter-spacing:.2px;border-right:1px solid rgba(0,0,0,.18)}
.columns{display:grid;grid-template-columns:repeat(9,1fr);height:calc(100% - 8vh);min-height:0}
.round-col{min-width:0;border-right:1px solid rgba(14,31,55,.6);position:relative;overflow:hidden;background:linear-gradient(180deg,#2b466f,#20375b)}
.round-col.empty:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(120,164,207,.16) 0 15%,transparent 16%),linear-gradient(90deg,transparent 49%,rgba(255,255,255,.03) 50%,transparent 51%)}
.match-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;filter:saturate(.85)}
.match-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,36,67,.35),rgba(15,36,67,.75))}
.player-list{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:2px 4px 3px}
.player{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;text-shadow:0 1px 3px #00172e;line-height:1.05;padding:3px 1px}
.player .name{font-size:clamp(8px,1vw,13px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.player .score{font-size:clamp(11px,1.15vw,16px);margin-top:4px;color:#fff}.player.win .score{color:#fff000}.player.win .name:before{content:'👑 ';font-size:.72em}
.map-name{position:absolute;left:0;right:0;bottom:0;background:rgba(0,161,221,.82);height:9%;min-height:25px;display:flex;align-items:center;justify-content:center;font-size:clamp(7px,.75vw,11px);font-weight:1000;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;z-index:5}
.totalbar{position:absolute;z-index:5;left:8%;right:8%;bottom:4vh;height:7vh;min-height:48px;background:#08a8e0;border-radius:0 0 13px 13px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 4px 15px rgba(0,80,130,.18);overflow:hidden}
.total{display:flex;align-items:center;justify-content:center;gap:8px;border-right:1px solid rgba(255,255,255,.75);font-size:clamp(10px,1.1vw,17px);font-weight:900}.total:last-child{border-right:0}.total .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}.total .p{font-size:clamp(12px,1.35vw,20px);font-weight:1000}
.year{position:absolute;z-index:4;left:0;right:0;bottom:.3vh;text-align:center;color:#27313a;font-weight:900;letter-spacing:clamp(7px,1vw,16px);font-size:clamp(14px,1.7vw,26px);padding-left:16px}
.corner{position:absolute;z-index:6;right:6px;bottom:2px;font-size:9px;opacity:.55;color:#8fa8b8}
#status{position:absolute;z-index:10;left:10px;bottom:6px;font-size:9px;color:#77909e;background:rgba(255,255,255,.65);padding:2px 5px;border-radius:4px}
@media(max-width:900px){.board{left:2%;right:2%;top:19vh;bottom:11vh}.totalbar{left:2%;right:2%}.logo-right{right:2%}.brand-sub{letter-spacing:3px}.round-title{font-size:9px}.player .name{font-size:7px}.player .score{font-size:10px}}
</style>
</head>
<body>
<div id="app">
  <div class="top-art"></div>
  <header class="header">
    <div class="brand"><div class="brand-small">Z I N G S P E E D</div><h1>RESULT<span>™</span></h1><div class="brand-sub">ASIAN CUP</div></div>
    <div class="logo-right"><div class="cup">ASIAN CUP</div><div><span class="mark">♜</span><span class="cn">红魔</span></div></div>
  </header>
  <section class="board">
    <div id="rounds" class="rounds"></div>
    <div id="columns" class="columns"></div>
  </section>
  <section id="totals" class="totalbar"></section>
  <div class="year">2 0 2 5 &nbsp; A S I A N &nbsp; C U P</div>
  <div id="status">Đang tải...</div>
</div>
<script>
const SHEET_ID='1_zrKpwAp0s8hMv8LZK208Qc-0SGE6npj_offF3ej5cw';
const SHEET_GVIZ=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;
let state={tournamentData:[],qualifyCount:3,updatedAt:null};let inventory={maps:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function decodeHash(){const raw=location.hash.startsWith('#data=')?location.hash.slice(6):'';if(!raw)return null;try{return JSON.parse(decodeURIComponent(raw));}catch(e){return null;}}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());cell='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cell+=c}row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);return rows}
async function loadMaps(){try{const r=await fetch(SHEET_GVIZ+encodeURIComponent('MAP'),{cache:'no-store'});if(!r.ok)return;const rows=parseCSV(await r.text());if(!rows.length)return;const h=rows[0].map(x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'));inventory.maps=rows.slice(1).map(r=>{const o={};h.forEach((x,i)=>o[x]=(r[i]||'').trim());return{name:o['ten map']||o['map']||o['ten']||'',image:o['anh map']||o['image map']||o['anh']||o['image']||''}}).filter(x=>x.name)}catch(e){}}
function loadData(){const h=decodeHash();if(h&&Array.isArray(h.tournamentData))state=h;else{try{const s=JSON.parse(localStorage.getItem('zsm_tournament_state')||'null');if(s&&Array.isArray(s.tournamentData))state=s}catch(e){}}state.tournamentData=(state.tournamentData||[]).slice(0,1);state.tournamentData.forEach(g=>{g.players=g.players||[];g.matches=g.matches||[];g.matches.forEach(m=>m.scores=m.scores||[])});render();}
function score(g,p,r){return Number(g.matches[r]?.scores?.[p])||0}
function total(g,p){return g.matches.reduce((s,m)=>s+score(g,p,g.matches.indexOf(m)),0)}
function render(){
 const g=state.tournamentData[0]||{players:[],matches:[]};
 const players=g.players||[]; const rounds=g.matches||[];
 document.getElementById('status').textContent=state.updatedAt?`Cập nhật ${new Date(state.updatedAt).toLocaleString('vi-VN')}`:'Kết quả thi đấu';
 const names=rounds.slice(0,9).map((_,i)=>`ROUND ${i+1}`);while(names.length<9)names.push(`ROUND ${names.length+1}`);
 document.getElementById('rounds').innerHTML=names.map(x=>`<div class="round-title">${x}</div>`).join('');
 const sorted=players.map((p,i)=>({p,i,t:total(g,i)}));
 const cols=document.getElementById('columns');cols.innerHTML='';
 for(let r=0;r<9;r++){
   const m=rounds[r];const col=document.createElement('div');col.className='round-col'+(m?'':' empty');
   if(m){const map=Number.isInteger(m.mapIndex)?inventory.maps[m.mapIndex]:null;if(map?.image){const bg=document.createElement('div');bg.className='match-bg';bg.style.backgroundImage=`url("${String(map.image).replace(/"/g,'&quot;')}")`;col.appendChild(bg);const ov=document.createElement('div');ov.className='match-overlay';col.appendChild(ov)}
     const list=document.createElement('div');list.className='player-list';
     const max=Math.max(...players.map((_,i)=>score(g,i,r)),0);
     players.forEach((p,i)=>{const el=document.createElement('div');el.className='player'+(score(g,i,r)===max&&max>0?' win':'');el.innerHTML=`<div class="name">${esc(p.name||'')}</div><div class="score">+${score(g,i,r)}</div>`;list.appendChild(el)});col.appendChild(list);
     const mn=document.createElement('div');mn.className='map-name';mn.textContent=map?.name||'CHƯA CHỌN MAP';col.appendChild(mn);
   }
   cols.appendChild(col);
 }
 const totals=document.getElementById('totals');
 const top=players.map((p,i)=>({p,i,t:total(g,i)})).sort((a,b)=>b.t-a.t);
 totals.innerHTML=top.slice(0,4).map(x=>`<div class="total"><span class="n">${esc(x.p.name||'')}</span><span class="p">${x.t}</span></div>`).join('');
 while(totals.children.length<4)totals.insertAdjacentHTML('beforeend','<div class="total"><span class="n">—</span><span class="p">0</span></div>');
}
function reload(){loadData();loadMaps()}
window.addEventListener('hashchange',reload);window.addEventListener('storage',()=>{if(!location.hash)loadData()});
loadData();loadMaps();setInterval(()=>{if(!location.hash){try{const s=JSON.parse(localStorage.getItem('zsm_tournament_state')||'null');if(s&&JSON.stringify(s.tournamentData)!==JSON.stringify(state.tournamentData)){state=s;state.tournamentData=(state.tournamentData||[]).slice(0,1);render()}}catch(e){}}},2000);
</script>
</body>
</html>
