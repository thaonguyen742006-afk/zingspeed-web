<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZingSpeed Mobile - StormyPetrel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        esports: {
                            bg: '#0b0c10',
                            card: '#12141d',
                            accent: '#a855f7',
                            cyan: '#06b6d4',
                            neonPink: '#ec4899',
                            neonGold: '#eab308',
                            border: '#1f2430'
                        }
                    },
                    boxShadow: {
                        'neon-purple': '0 0 20px rgba(168, 85, 247, 0.4)',
                        'neon-cyan': '0 0 20px rgba(6, 182, 212, 0.4)',
                        'neon-gold': '0 0 15px rgba(234, 179, 8, 0.5)',
                    }
                }
            }
        }
    </script>

    <style>

        /* ===== Fantasy Castle Parallax Background ===== */
        #parallax-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            isolation: isolate;
        }

        #parallax-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(23, 25, 35, 0.38) 0%,
                rgba(23, 25, 35, 0.58) 58%,
                rgba(23, 25, 35, 0.82) 100%
            );
            z-index: 2;
        }

        #parallax-bg img {
            position: absolute;
            left: 50%;
            top: -7vh;
            width: max(105vw, 1500px);
            max-width: none;
            height: auto;
            transform: translate3d(-50%, 0, 0) scale(1.02);
            transform-origin: center top;
            opacity: 0.78;
            will-change: transform;
            user-select: none;
        }

        body > *:not(#parallax-bg) {
            position: relative;
            z-index: 1;
        }

        body {
            background-color: #08090d;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            color: #f3f4f6;
        }

        .orbitron { fontFamily: 'Orbitron', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0c10;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2e3d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7;
        }

        .glass-panel {
            background: rgba(18, 20, 29, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glow-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.7);
        }
        .glow-text-purple {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.7);
        }

        @keyframes shufflePulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.7; filter: hue-rotate(90deg); }
            100% { transform: scale(1); opacity: 1; }
        }

        .shuffling {
            animation: shufflePulse 0.15s infinite alternate;
        }
    
        .inventory-thumb { width: 110px; height: 72px; object-fit: contain; border-radius: 10px; background: rgba(0,0,0,.35); border: 1px solid rgba(75,85,99,.6); }
        .map-thumb { width: 86px; height: 50px; object-fit: cover; border-radius: 10px; background: rgba(0,0,0,.35); border: 1px solid rgba(75,85,99,.6); }
        .inventory-select { width: 100%; background: rgba(0,0,0,.45); border: 1px solid rgba(75,85,99,.9); border-radius: 10px; color: white; padding: 8px 10px; font-size: 12px; font-weight: 700; outline: none; }
        .inventory-select:focus { border-color: #06b6d4; }
        .matches-details > summary::-webkit-details-marker { display:none; }
        details > summary { list-style:none; }

        /* ===== Pastel Esports Theme ===== */
        body {
            background-color: #171923 !important;
            background-image:
                radial-gradient(circle at 12% 15%, rgba(255,154,162,.16) 0%, transparent 34%),
                radial-gradient(circle at 88% 25%, rgba(181,234,215,.13) 0%, transparent 32%),
                radial-gradient(circle at 75% 90%, rgba(199,206,234,.14) 0%, transparent 36%);
            color: #f8f7fb;
        }
        .glass-panel {
            background: rgba(36, 40, 58, .72) !important;
            border-color: rgba(255,255,255,.10) !important;
        }
        .bg-purple-600, .bg-purple-500 { background-color: #FF9AA2 !important; }
        .bg-cyan-500, .bg-cyan-400 { background-color: #B5EAD7 !important; }
        .bg-yellow-500 { background-color: #FFD1AC !important; }
        .bg-red-500 { background-color: #FF9AA2 !important; }
        .bg-purple-900 { background-color: rgba(255,154,162,.24) !important; }
        .bg-cyan-900 { background-color: rgba(181,234,215,.20) !important; }
        .bg-red-900 { background-color: rgba(255,154,162,.20) !important; }
        .text-purple-400, .text-purple-300 { color: #FFB7B2 !important; }
        .text-cyan-400, .text-cyan-300 { color: #B5EAD7 !important; }
        .text-yellow-500, .text-yellow-400, .text-yellow-300 { color: #FFD1AC !important; }
        .text-red-400, .text-red-300 { color: #FF9AA2 !important; }
        .border-purple-500, .border-purple-400 { border-color: #FF9AA2 !important; }
        .border-cyan-500, .border-cyan-400 { border-color: #B5EAD7 !important; }
        .border-yellow-500, .border-yellow-400 { border-color: #FFD1AC !important; }
        .border-red-500 { border-color: #FF9AA2 !important; }
        .hover\:text-red-400:hover { color: #FF9AA2 !important; }
        .hover\:text-white:hover { color: #ffffff !important; }
        .focus\:border-cyan-400:focus { border-color: #B5EAD7 !important; }
        .shadow-neon-purple { box-shadow: 0 0 20px rgba(255,154,162,.30) !important; }
        .shadow-neon-cyan { box-shadow: 0 0 20px rgba(181,234,215,.26) !important; }
        .shadow-neon-gold { box-shadow: 0 0 15px rgba(255,209,172,.30) !important; }
        .glow-text-purple { text-shadow: 0 0 10px rgba(255,154,162,.55) !important; }
        .glow-text-cyan { text-shadow: 0 0 10px rgba(181,234,215,.55) !important; }
        .inventory-select:focus { border-color: #B5EAD7 !important; box-shadow: 0 0 0 2px rgba(181,234,215,.12); }
        .inventory-thumb, .map-thumb { border-color: rgba(255,183,178,.38); background: rgba(23,25,35,.55); }
        ::-webkit-scrollbar-track { background: #171923; }
        ::-webkit-scrollbar-thumb { background: #4b5068; }
        ::-webkit-scrollbar-thumb:hover { background: #FF9AA2; }

        /* Header / logo gradients using the supplied pastel palette */
        .bg-gradient-to-tr.from-purple-600.to-cyan-500 {
            background-image: linear-gradient(135deg, #FF9AA2, #B5EAD7) !important;
        }
        .bg-gradient-to-r.from-purple-400.via-cyan-400.to-pink-500 {
            background-image: linear-gradient(90deg, #FF9AA2, #B5EAD7, #C7CEEA) !important;
        }

        .race-time-input { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
        .match-scoring-mode { min-width: 250px; }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">
    <!-- Parallax fantasy background -->
    <div id="parallax-bg" aria-hidden="true">
        <img src="https://lh3.googleusercontent.com/d/1rWr8SHz96uXa_3Tl7p6v4i-ZARuo5oc4=s1600" alt="Logo">
    </div>
</body>
</html>
