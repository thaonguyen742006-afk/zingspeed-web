<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZingSpeed Mobile - Tournament Group Drawer - Scoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        esports: {
                            bg: '#0b0c10',
                            card: '#12141d',
                            accent: '#a855f7',
                            cyan: '#06b6d4',
                            neonPink: '#ec4899',
                            neonGold: '#eab308',
                            border: '#1f2430'
                        }
                    },
                    boxShadow: {
                        'neon-purple': '0 0 20px rgba(168, 85, 247, 0.4)',
                        'neon-cyan': '0 0 20px rgba(6, 182, 212, 0.4)',
                        'neon-gold': '0 0 15px rgba(234, 179, 8, 0.5)',
                    }
                }
            }
        }
    </script>

    <style>
        #parallax-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            isolation: isolate;
        }

        #parallax-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(23, 25, 35, 0.38) 0%,
                rgba(23, 25, 35, 0.58) 58%,
                rgba(23, 25, 35, 0.82) 100%
            );
            z-index: 2;
        }

        #parallax-bg img {
            position: absolute;
            left: 50%;
            top: -7vh;
            width: max(105vw, 1500px);
            max-width: none;
            height: auto;
            transform: translate3d(-50%, 0, 0) scale(1.02);
            transform-origin: center top;
            opacity: 0.78;
            will-change: transform;
            user-select: none;
        }

        body > *:not(#parallax-bg) {
            position: relative;
            z-index: 1;
        }

        body {
            background-color: #08090d;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            color: #f3f4f6;
        }

        .orbitron { fontFamily: 'Orbitron', sans-serif; }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0c10;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2e3d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7;
        }

        .glass-panel {
            background: rgba(18, 20, 29, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glow-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.7);
        }
        .glow-text-purple {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.7);
        }

        body {
            background-color: #171923 !important;
            background-image:
                radial-gradient(circle at 12% 15%, rgba(255,154,162,.16) 0%, transparent 34%),
                radial-gradient(circle at 88% 25%, rgba(181,234,215,.13) 0%, transparent 32%),
                radial-gradient(circle at 75% 90%, rgba(199,206,234,.14) 0%, transparent 36%);
            color: #f8f7fb;
        }
        .glass-panel {
            background: rgba(36, 40, 58, .72) !important;
            border-color: rgba(255,255,255,.10) !important;
        }
        .bg-purple-600, .bg-purple-500 { background-color: #FF9AA2 !important; }
        .bg-cyan-500, .bg-cyan-400 { background-color: #B5EAD7 !important; }
        .bg-yellow-500 { background-color: #FFD1AC !important; }
        .bg-red-500 { background-color: #FF9AA2 !important; }
        .text-purple-400, .text-purple-300 { color: #FFB7B2 !important; }
        .text-cyan-400, .text-cyan-300 { color: #B5EAD7 !important; }
        .text-yellow-500, .text-yellow-400, .text-yellow-300 { color: #FFD1AC !important; }
        .text-red-400, .text-red-300 { color: #FF9AA2 !important; }
        .border-purple-500, .border-purple-400 { border-color: #FF9AA2 !important; }
        .border-cyan-500, .border-cyan-400 { border-color: #B5EAD7 !important; }
        .border-yellow-500, .border-yellow-400 { border-color: #FFD1AC !important; }
        .border-red-500 { border-color: #FF9AA2 !important; }
        .hover\:text-red-400:hover { color: #FF9AA2 !important; }
        .hover\:text-white:hover { color: #ffffff !important; }
        .focus\:border-cyan-400:focus { border-color: #B5EAD7 !important; }
        
        .time-input {
            background: rgba(0,0,0,.4);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 6px;
            color: #fff;
            padding: 4px 8px;
            font-size: 13px;
            width: 90px;
            text-align: center;
        }
        .time-input:focus {
            border-color: #B5EAD7;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

    <div class="max-w-5xl mx-auto w-full glass-panel rounded-2xl p-6 shadow-2xl">
        <h1 class="text-3xl font-bold font-orbitron text-center text-cyan-300 mb-6 uppercase tracking-wider glow-text-cyan">
            Chi Tiết 9 Trận Đấu & Tính Điểm
        </h1>

        <!-- Lựa chọn hình thức đua -->
        <div class="flex flex-col sm:flex-row items-center justify-between bg-black/30 p-4 rounded-xl border border-white/10 mb-6">
            <label class="font-bold text-lg text-purple-300 mb-2 sm:mb-0">Hình Thức Đua Tính Điểm:</label>
            <select id="raceModeSelect" onchange="calculateScores()" class="bg-gray-800 text-cyan-300 border border-cyan-400/40 font-bold py-2 px-4 rounded-lg outline-none focus:border-cyan-400">
                <option value="tournament">Đua Theo Hình Thức Giải Đấu (Cán đích: 11pt, -1pt/giây | Lỗi: 0pt)</option>
                <option value="1234">Đua Theo Hình Thức 1234 (Top 1: 4pt, Top 2: 3pt... | Lỗi: 1pt)</option>
            </select>
        </div>

        <!-- Bảng Nhập Thời Gian 9 Trận -->
        <div class="overflow-x-auto mb-6">
            <table class="w-full text-sm text-center border-collapse">
                <thead>
                    <tr class="bg-purple-900/40 text-purple-300 font-orbitron border-b border-white/10">
                        <th class="p-3 text-left">Người Chơi</th>
                        <script>
                            for(let i=1; i<=9; i++) {
                                document.write(`<th class="p-2">Trận ${i}</th>`);
                            }
                        </script>
                        <th class="p-3 text-cyan-300 font-bold text-base">Tổng Điểm</th>
                    </tr>
                </thead>
                <tbody id="matchTableBody">
                    <!-- Dữ liệu hàng người chơi sẽ hiển thị tại đây -->
                </tbody>
            </table>
        </div>

        <div class="text-xs text-gray-400 italic bg-black/20 p-3 rounded-lg border border-white/5">
            * <b>Hướng dẫn nhập thời gian:</b> Nhập trực tiếp các chữ số (ví dụ: gõ <code>11111</code> sẽ tự động định dạng thành <code>01:11:11</code>). Để trống hoặc nhập không đủ thời gian/lỗi sẽ được tính là <b>Không cán đích</b>.
        </div>
    </div>

    <script>
        // Danh sách người chơi mẫu
        const players = [
            { id: 1, name: "Người chơi A" },
            { id: 2, name: "Người chơi B" },
            { id: 3, name: "Người chơi C" },
            { id: 4, name: "Người chơi D" }
        ];

        // Khởi tạo bảng nhập liệu
        function initTable() {
            const tbody = document.getElementById('matchTableBody');
            tbody.innerHTML = '';

            players.forEach((player, pIdx) => {
                let rowHtml = `<tr class="border-b border-white/5 hover:bg-white/5 transition">
                    <td class="p-3 text-left font-bold text-gray-200">${player.name}</td>`;
                
                for (let mIdx = 1; mIdx <= 9; mIdx++) {
                    rowHtml += `<td class="p-2">
                        <input type="text" 
                               id="p${pIdx}_m${mIdx}" 
                               class="time-input" 
                               placeholder="00:00:00" 
                               maxlength="8" 
                               onblur="formatTimeInput(this)" 
                               oninput="calculateScores()">
                    </td>`;
                }

                rowHtml += `<td class="p-3 font-bold text-lg text-cyan-300 font-orbitron" id="totalScore_${pIdx}">0</td></tr>`;
                tbody.innerHTML += rowHtml;
            });
        }

        // Tự động định dạng input thành 00:00:00 (Ví dụ: 11111 -> 01:11:11)
        function formatTimeInput(input) {
            let digits = input.value.replace(/\D/g, ''); // Chỉ giữ lại số
            if (!digits) return;

            // Thêm số 0 vào đầu nếu độ dài < 6
            digits = digits.padStart(6, '0');
            if (digits.length > 6) {
                digits = digits.slice(-6); // Chỉ lấy 6 số cuối
            }

            const hh = digits.slice(0, 2);
            const mm = digits.slice(2, 4);
            const ss = digits.slice(4, 6);

            input.value = `${hh}:${mm}:${ss}`;
            calculateScores();
        }

        // Chuyển đổi định dạng "HH:MM:SS" sang số giây
        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return null;
            const parts = timeStr.split(':');
            if (parts.length !== 3) return null;

            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const s = parseInt(parts[2], 10);

            if (isNaN(h) || isNaN(m) || isNaN(s)) return null;
            return h * 3600 + m * 60 + s;
        }

        // Hàm tính toán điểm số cho tất cả trận đấu
        function calculateScores() {
            const mode = document.getElementById('raceModeSelect').value;
            const totalScores = new Array(players.length).fill(0);

            // Duyệt qua từng trận đấu (từ trận 1 đến trận 9)
            for (let mIdx = 1; mIdx <= 9; mIdx++) {
                let matchData = [];

                // Lấy thời gian của tất cả người chơi trong trận mIdx
                players.forEach((_, pIdx) => {
                    const inputVal = document.getElementById(`p${pIdx}_m${mIdx}`).value.trim();
                    const seconds = parseTimeToSeconds(inputVal);
                    matchData.push({ pIdx, seconds });
                });

                if (mode === 'tournament') {
                    // Logic giải đấu:
                    // Lọc ra các người chơi cán đích (seconds !== null)
                    let finished = matchData.filter(d => d.seconds !== null);
                    
                    if (finished.length > 0) {
                        // Tìm thời gian hoàn thành sớm nhất
                        let minSeconds = Math.min(...finished.map(d => d.seconds));

                        finished.forEach(d => {
                            let diff = d.seconds - minSeconds; // Số giây chênh lệch so với hạng 1
                            let score = 11 - diff;
                            if (score < 0) score = 0; // Điểm không được âm
                            totalScores[d.pIdx] += score;
                        });
                    }
                    // Người không cán đích (d.seconds === null) sẽ nhận 0 điểm (mặc định)

                } else if (mode === '1234') {
                    // Logic 1234:
                    let finished = matchData.filter(d => d.seconds !== null);
                    let notFinished = matchData.filter(d => d.seconds === null);

                    // Sắp xếp thời gian cán đích tăng dần (sớm nhất lên đầu)
                    finished.sort((a, b) => a.seconds - b.seconds);

                    // Gán điểm theo thứ hạng: Hạng 1 = 4đ, Hạng 2 = 3đ, Hạng 3 = 2đ, Hạng 4 = 1đ...
                    finished.forEach((d, rank) => {
                        let score = 4 - rank;
                        if (score < 1) score = 1; // Tối thiểu điểm nếu quá nhiều người chơi
                        totalScores[d.pIdx] += score;
                    });

                    // Không cán đích nhận 1 điểm
                    notFinished.forEach(d => {
                        totalScores[d.pIdx] += 1;
                    });
                }
            }

            // Cập nhật tổng điểm lên giao diện
            players.forEach((_, pIdx) => {
                document.getElementById(`totalScore_${pIdx}`).innerText = totalScores[pIdx];
            });
        }

        // Khởi chạy khi tải trang
        window.onload = initTable;
    </script>
</body>
</html>
